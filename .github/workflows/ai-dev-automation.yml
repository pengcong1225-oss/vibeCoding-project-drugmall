# .github/workflows/ai-dev-automation.yml
name: AI Dev Automation Pipeline

on:
  push:
    branches: [ main ]
  issues:
    types: [ labeled ]
  pull_request:
    types: [ opened, synchronize ]
  schedule:
    - cron: "0 2 * * *"      # UTC 2:00 = 北京时间 10:00
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Guardian – 代码主动扫描（先不自动PR，仅测试）
  # ============================================================
  guardian-scan:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guardian
        run: pip install guardian

      - name: Create guardian config
        run: |
          mkdir -p .guardian
          cat > .guardian/config.yml <<EOF
          provider: openai
          model: deepseek-chat
          base_url: https://api.deepseek.com
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          severity_threshold: high
          exclude:
            - "**/test/**"
            - "**/vendor/**"
          EOF

      - name: Run guardian scan
        env:
          OPENAI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com
        run: |
          guardian scan -c .guardian/config.yml

  # ============================================================
  # Job 2: Claude Tree – 自动实现带 auto-dev 标签的 Issue
  # ============================================================
  claude-tree:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'auto-dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Tree & Setup DeepSeek
        run: |
          npm install -g @claudetree/cli
          echo "ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic" >> $GITHUB_ENV
          echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
          echo "ANTHROPIC_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash" >> $GITHUB_ENV
          echo "CLAUDE_CODE_SUBAGENT_MODEL=deepseek-v4-flash" >> $GITHUB_ENV
          echo "CLAUDE_CODE_EFFORT_LEVEL=max" >> $GITHUB_ENV

      - name: Run Claude Tree on Issue
        run: ct start ${{ github.event.issue.html_url }} --max-cost 5.0

  # ============================================================
  # Job 3: PR Worker – 自定义 DeepSeek 审查脚本（需要先创建脚本）
  # ============================================================
  pr-worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run PR review script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/pr_reviewer.py