# .github/workflows/ai-dev-automation.yml
name: AI Dev Automation Pipeline

on:
  push:
    branches: [ main ]
  issues:
    types: [ labeled ]
  pull_request:
    types: [ opened, synchronize ]
  schedule:
    # 定时任务：每天UTC时间 02:00 (北京时间 10:00) 运行一次
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Guardian - 主动巡检，发现问题，自动提交修复PR
  # ============================================================
  guardian-scan:
    # 触发条件：代码推送后 或 定时任务启动 或 手动执行
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Guardian Scan & Fix
        uses: LakshmiSravyaVedantham/guardian-action@v1
        with:
          # 使用 DeepSeek API Key
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Guardian 会在发现高置信度问题时自动创建一个修复PR

  # ============================================================
  # Job 2: Claude Tree - 智能开发，自动实现打上标签的Issue
  # ============================================================
  claude-tree:
    # 触发条件：Issue被打上 'auto-dev' 标签
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'auto-dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Claude Code to use DeepSeek
        run: |
          npm install -g @claudetree/cli
          echo "ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic" >> $GITHUB_ENV
          echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
          echo "ANTHROPIC_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash" >> $GITHUB_ENV
          echo "CLAUDE_CODE_SUBAGENT_MODEL=deepseek-v4-flash" >> $GITHUB_ENV
          echo "CLAUDE_CODE_EFFORT_LEVEL=max" >> $GITHUB_ENV
      
      - name: Auto-Implement Issue
        run: ct start ${{ github.event.issue.html_url }} --max-cost 5.0

  # ============================================================
  # Job 3: PR Worker - 智能审查，分析PR并反馈改进建议
  # ============================================================
  pr-worker:
    # 触发条件：有新的PR被打开 或 现有PR有代码更新
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        # 必须获取完整的提交历史，以便正确生成摘要
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Auto-Review PR
        uses: nejcm/pr-summary-github-action@main
        with:
          ghToken: ${{ secrets.PAT }}
          # 配置使用 DeepSeek 模型进行分析
          deepseekKey: ${{ secrets.ANTHROPIC_API_KEY  }}
          deepseekModel: "deepseek-chat"
          # 自定义审查提示词
          prompt: |
            你是一位资深的代码审查专家。请总结以下 PR 的改动，并重点审查以下方面：
            1. **功能性**: 代码是否实现了PR描述的目标？
            2. **安全性**: 是否存在明显的安全漏洞（如SQL注入、XSS等）？
            3. **性能**: 是否存在潜在的性能问题（如N+1查询、未优化的循环等）？
            4. **代码质量**: 是否符合最佳实践？命名是否清晰？代码是否易于维护？
            
            请用中文回复，并提供具体、可执行的改进建议。