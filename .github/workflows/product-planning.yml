name: Product Planning Automation

on:
  workflow_dispatch:          # 允许手动触发
  schedule:
    - cron: '0 0 * * 1'       # 每周一 UTC 0 点自动运行

jobs:
  planning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y curl git

      # ========== 工具安装 ==========
      - name: Install Tools
        run: |
          # Skene (代码考古)
          curl -fsSL https://raw.githubusercontent.com/SkeneTechnologies/skene/main/tui/install.sh | bash
          # Prodo (AI 规划)
          npm i -g @shahmarasy/prodo
          # Claude Code CLI
          npm i -g @anthropic-ai/claude-code
          # 本地安装 Anthropic SDK（确保 Prodo 技能可用）
          npm i @anthropic-ai/sdk
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ========== 环境配置 ==========
      - name: Configure DeepSeek Environment
        run: |
          echo "ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic" >> $GITHUB_ENV
          echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV
          echo "ANTHROPIC_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-pro[1m]" >> $GITHUB_ENV
          echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash" >> $GITHUB_ENV
          echo "PRODO_AGENT=anthropic" >> $GITHUB_ENV
          echo "ANTHROPIC_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV

      # ========== 步骤1：代码考古 ==========
      - name: 1. Run Code Archaeology (Skene)
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: deepseek
        run: |
          skene analyze || echo "Warning: Skene analysis failed, continuing..."

      # ========== 步骤2：需求感知 ==========
      - name: 2. Demand Sensing (Custom with gh + Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching issues..."
          gh issue list --state all --limit 100 \
            --json number,title,body,labels,comments,reactionGroups \
            > issues.json

          if [ ! -s issues.json ] || [ "$(cat issues.json)" = "[]" ]; then
            echo "# User Demand Map" > readyourusers-report.md
            echo "当前仓库暂无 Issue 数据。" >> readyourusers-report.md
          else
            cat > /tmp/demand_prompt.md << 'PROMPT'
          你是一名资深产品经理。请分析 issues.json 文件中的 GitHub Issues 数据。
          请生成用户需求地图，写入 readyourusers-report.md……
          PROMPT
            claude -p "$(cat /tmp/demand_prompt.md)" \
              --allowedTools "Read" \
              --max-turns 20
          fi

      # ========== 步骤3：AI 规划（Prodo）+ 排查 ==========
      - name: 3. Prepare brief and Init Prodo
        run: |
          echo "Merging analysis results..."
          echo "# Combined Brief for Prodo" > combined_brief.md
          [ -f skene-context/growth-plan.md ] && cat skene-context/growth-plan.md >> combined_brief.md
          [ -f readyourusers-report.md ] && cat readyourusers-report.md >> combined_brief.md
          cp combined_brief.md brief.md

          if [ ! -f "prodo.config.json" ] && [ ! -f ".prodo/config.json" ]; then
            echo "Initializing Prodo..."
            yes | prodo init . --ai claude-cli --lang zh --author "Product Brain"
          fi

      # ---- 排查步骤开始 ----
      - name: 🔍 Debug - Check Node Environment
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Listing installed @anthropic-ai/sdk..."
          npm list @anthropic-ai/sdk || echo "SDK not found in local node_modules!"
          ls -d node_modules/@anthropic-ai/sdk 2>/dev/null || echo "Directory node_modules/@anthropic-ai/sdk missing!"
          echo "Current working directory: $(pwd)"
          echo "NODE_PATH before: $NODE_PATH"

      - name: 🔍 Debug - Prodo Doctor
        run: prodo doctor
        continue-on-error: true   # 即使 doctor 报错也继续，仅用于诊断

      - name: 🔍 Debug - Set NODE_PATH and retry
        run: |
          # 将本地 node_modules 显式添加到 NODE_PATH
          export NODE_PATH="$(pwd)/node_modules:$NODE_PATH"
          echo "NODE_PATH after export: $NODE_PATH"
          # 现在尝试运行 generate
          prodo generate
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
      # ---- 排查步骤结束 ----
      # 如果上面一步成功生成了 PRD，后续的步骤会正常执行，否则失败。

      # ========== 步骤4：合并报告并派发 Issue ==========
      - name: 4. Combine Reports and Auto-Dispatch Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# AI Product Analysis Report $(date +%Y-%m-%d)" > analysis_summary.md
          [ -f skene-context/growth-plan.md ] && cat skene-context/growth-plan.md >> analysis_summary.md
          [ -f readyourusers-report.md ] && cat readyourusers-report.md >> analysis_summary.md
          [ -f product-docs/prd.md ] && cat product-docs/prd.md >> analysis_summary.md

          if [ -f "product-docs/stories.md" ]; then
            awk '/^## /{if (title) {system("gh issue create --title \"" title "\" --body \"" body "\" --label feature-request")}; title=substr($0,4); body=""; next} {body=body $0 "\n"}' product-docs/stories.md
          else
            gh issue create --title "🤖 AI Product Analysis Report $(date +%Y-%m-%d)" --body "查看完整报告：[analysis_summary.md](./analysis_summary.md)" --label "product-insight"
          fi

      # ========== 步骤5：提交报告 ==========
      - name: 5. Commit Reports
        run: |
          git config user.name "Product Brain Bot"
          git config user.email "brain-bot@your-domain.com"
          git add analysis_summary.md product-docs/ skene-context/ readyourusers-report.md combined_brief.md brief.md 2>/dev/null || true
          git add issues.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Automated product analysis and PRD $(date +%Y-%m-%d)"
            git push
          fi