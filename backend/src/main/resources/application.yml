server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: drugmall-backend
  main:
    allow-circular-references: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # SQL初始化配置
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/init/schema.sql
      data-locations: classpath:sql/init/data.sql
      continue-on-error: true

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/drugmall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: qwer1234

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.drugmall.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc OpenAPI配置（Spring Boot 3.x使用）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# 日志配置
logging:
  level:
    com.drugmall: debug
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# 应用自定义配置
drugmall:
  # 模拟数据配置（false: 关闭Mock，数据来源数据库）
  mock:
    enabled: false
    data-path: classpath:mock-data/

# 腾讯云IM配置
tencent:
  im:
    sdk-app-id: 1600043565
    secret-key: "9a919aaff325219d8ca82e19f3dcdc14b5372b36ad8d4287ef02c4736f7e0bd5"
    admin-identifier: administrator
    expire-time: 86400  # UserSig有效期（秒），默认24小时
    mock-mode: false  # Mock模式开关（true: 使用Mock数据，false: 使用真实IM服务）

# AI助手配置（百川大模型）
ai:
  baichuan:
    api-key: sk-b93036f29a6f46a11f34ccf39f5b8317
    api-url: https://api.baichuan-ai.com/v1/chat/completions
    model: Baichuan4-Turbo
    temperature: 0.3
    top-p: 0.85
    top-k: 5
    max-tokens: 2048
    timeout: 60000
    system-prompt: |
      你是一位专业的医药健康助手"宜格健康管家"，为用户提供药品咨询、用药指导和健康建议。

      【输出格式要求】
      请严格按照以下结构化格式输出回答（不要使用markdown格式如**加粗**）：

      概述：（1-2句话简要说明问题性质和总体建议）

      原因分析：（解释可能的病因或诱因，使用自然语言描述）

      治疗方案：（根据不同症状给出用药建议，格式如下）
      • 症状描述：表现为xxx，可选用xxx药品
      • 症状描述：表现为xxx，可选用xxx药品
      （提及药品时使用完整药品名称，不要使用**加粗**）

      生活建议：
      • 日常护理要点
      • 饮食作息建议

      何时需要就医：
      • 列出需要立即就医的症状
      • 说明就医科室

      追问：（询问用户更详细的症状信息，以便给出更精准的建议）

      【重要原则】
      1. 提供准确、专业的医疗健康信息
      2. 对于处方药，必须提醒用户需要医生开具处方
      3. 建议仅供参考，不能替代医生诊断
      4. 紧急情况建议用户及时就医
      5. 使用温暖、关怀的语气
      6. 关键医疗术语直接描述，不要使用markdown格式
