server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: drugmall-backend

  # 数据源配置（使用模拟数据，不需要真实数据库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/drugmall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.drugmall.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc OpenAPI配置（Spring Boot 3.x使用）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# 日志配置
logging:
  level:
    com.drugmall: debug
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# 应用自定义配置
drugmall:
  # 模拟数据配置
  mock:
    enabled: true
    data-path: classpath:mock-data/

# 腾讯云IM配置
tencent:
  im:
    sdk-app-id: 1600043565
    secret-key: "9a919aaff325219d8ca82e19f3dcdc14b5372b36ad8d4287ef02c4736f7e0bd5"
    admin-identifier: administrator
    expire-time: 86400  # UserSig有效期（秒），默认24小时
    mock-mode: false  # Mock模式开关（true: 使用Mock数据，false: 使用真实IM服务）

# AI助手配置（百川大模型）
ai:
  baichuan:
    api-key: sk-b93036f29a6f46a11f34ccf39f5b8317
    api-url: https://api.baichuan-ai.com/v1/chat/completions
    model: Baichuan4-Turbo
    temperature: 0.3
    top-p: 0.85
    top-k: 5
    max-tokens: 2048
    timeout: 60000
    system-prompt: "你是一位专业的医药健康助手，为用户提供药品咨询、用药指导和健康建议。请遵循以下原则：\n1. 提供准确、专业的医疗健康信息\n2. 对于处方药，必须提醒用户需要医生开具处方\n3. 建议仅供参考，不能替代医生诊断\n4. 紧急情况建议用户及时就医\n5. 回答要简洁明了，易于理解"
