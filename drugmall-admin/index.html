<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DrugMall 药品电商平台管理后台" />
    <title>DrugMall 管理后台</title>
    <style>
      html, body, #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app {
        min-width: 1280px;
      }
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f5f7fa;
      }
      .app-loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-loading-text {
        margin-top: 16px;
        color: #606266;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
